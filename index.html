<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow | Suraj Kumar Singh</title>
<style>
  :root{
    --navy: #14213d;
    --navy-2: #1c2b4a;
    --teal: #14b8a6;
    --teal-dark: #0d9488;
    --bg-peach: #f7e9de;
    --bg-blue: #dfeaf2;
    --card: #ffffff;
    --panel: #f4f6f9;
    --border: #e7ebf1;
    --text-dark: #14213d;
    --text-muted: #7a8698;
    --text-faint: #a9b2c1;
    --danger: #e2574c;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-peach) 0%, #f3edea 35%, var(--bg-blue) 100%);
    padding: 48px 24px 80px;
    color: var(--text-dark);
  }

  .card{
    max-width: 1200px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    padding: 48px 56px 40px;
    box-shadow: 0 20px 60px rgba(20,33,61,0.08);
  }

  .eyebrow{
    color: var(--teal-dark);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1.5px;
    margin: 0 0 10px;
  }

  .header-row{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    flex-wrap: wrap;
  }

  h1{
    font-size: 56px;
    margin: 0 0 14px;
    font-weight: 800;
    letter-spacing: -1px;
  }

  .subtitle{
    color: var(--text-muted);
    font-size: 17px;
    margin: 0;
  }

  .progress-box{
    background: var(--navy);
    color: #fff;
    border-radius: 18px;
    padding: 22px 28px;
    min-width: 280px;
  }
  .progress-box .pct{
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .progress-track{
    height: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--teal);
    border-radius: 8px;
    transition: width 0.3s ease;
  }

  .field-label{
    display:block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .input-row{
    display:grid;
    grid-template-columns: 1fr 220px 200px 160px;
    gap: 16px;
    margin-top: 36px;
  }

  .field input, .field select{
    width: 100%;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    font-size: 15px;
    color: var(--text-dark);
    font-family: inherit;
    outline: none;
    appearance: none;
  }
  .field input:focus, .field select:focus{
    border-color: var(--teal);
    background: #fff;
  }
  .field.date-field{ position: relative; }
  .field.date-field input[type="date"]{
    color: var(--text-dark);
  }
  .field.date-field input[type="date"]::-webkit-calendar-picker-indicator{
    cursor:pointer;
  }
  .field select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8' viewBox='0 0 14 8'><path d='M1 1l6 6 6-6' stroke='%237a8698' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat: no-repeat;
    background-position: right 18px center;
    padding-right: 40px;
  }

  .add-btn{
    align-self: end;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    padding: 16px 18px;
    transition: background 0.15s ease;
  }
  .add-btn:hover{ background: var(--teal-dark); }

  .search-row{
    display:grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    margin-top: 20px;
    align-items: end;
  }

  .filters{
    display:flex;
    background: var(--panel);
    border-radius: 14px;
    padding: 6px;
    gap: 4px;
  }
  .filters button{
    border:none;
    background: transparent;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-muted);
    cursor:pointer;
  }
  .filters button.active{
    background: #fff;
    color: var(--teal-dark);
    box-shadow: 0 2px 8px rgba(20,33,61,0.08);
  }

  .stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 28px;
  }
  .stat{
    background: var(--panel);
    border-radius: 18px;
    padding: 22px 26px;
  }
  .stat .num{
    font-size: 30px;
    font-weight: 800;
  }
  .stat .lbl{
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 2px;
  }

  .list-panel{
    background: var(--panel);
    border-radius: 20px;
    margin-top: 28px;
    min-height: 180px;
    padding: 10px;
  }

  .empty-state{
    padding: 70px 20px;
    text-align:center;
  }
  .empty-state .h{
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .empty-state .s{
    color: var(--text-muted);
    font-size: 15px;
  }

  .task-item{
    display:flex;
    align-items:center;
    gap: 16px;
    background: #fff;
    border-radius: 16px;
    padding: 18px 20px;
    margin: 8px;
  }
  .task-item + .task-item{ margin-top: 0; }

  .task-check{
    width: 24px;
    height: 24px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: #fff;
    cursor: pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: #fff;
    font-size: 14px;
  }
  .task-check.checked{
    background: var(--teal);
    border-color: var(--teal);
  }

  .task-main{ flex:1; min-width:0; }
  .task-title{
    font-weight: 700;
    font-size: 16px;
    word-break: break-word;
  }
  .task-title.done{
    text-decoration: line-through;
    color: var(--text-faint);
  }
  .task-meta{
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-muted);
    display:flex;
    gap: 10px;
    align-items:center;
    flex-wrap: wrap;
  }

  .badge{
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .badge.low{ background:#e7f6ee; color:#1f9d55; }
  .badge.normal{ background:#eef1fb; color:#4f5fd6; }
  .badge.high{ background:#fdeceb; color:#e2574c; }

  .task-delete{
    border:none;
    background: transparent;
    color: var(--text-faint);
    cursor:pointer;
    font-size: 20px;
    padding: 6px;
    border-radius: 8px;
    flex-shrink:0;
  }
  .task-delete:hover{ color: var(--danger); background: #fdeceb; }

  .footer-row{
    display:flex;
    justify-content: flex-end;
    gap: 28px;
    margin-top: 20px;
  }
  .footer-row button{
    background:none;
    border:none;
    color: var(--text-muted);
    font-weight: 700;
    font-size: 15px;
    cursor:pointer;
  }
  .footer-row button:hover{ color: var(--text-dark); }

  @media (max-width: 900px){
    .card{ padding: 32px 24px; }
    h1{ font-size: 40px; }
    .input-row{ grid-template-columns: 1fr; }
    .search-row{ grid-template-columns: 1fr; }
    .stats{ grid-template-columns: 1fr; }
    .header-row{ flex-direction: column; }
    .progress-box{ width: 100%; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header-row">
      <div>
        <p class="eyebrow">JAVASCRIPT PROJECT</p>
        <h1>TaskFlow</h1>
        <p class="subtitle">Plan the day, sort priorities, and keep your work moving.</p>
      </div>
      <div class="progress-box">
        <div class="pct" id="pctText">0% done</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="input-row">
      <div class="field">
        <label class="field-label">TASK</label>
        <input type="text" id="taskInput" placeholder="Add a task..." />
      </div>
      <div class="field date-field">
        <label class="field-label">DUE</label>
        <input type="date" id="dueInput" />
      </div>
      <div class="field">
        <label class="field-label">PRIORITY</label>
        <select id="priorityInput">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
      </div>
      <button class="add-btn" id="addBtn">Add Task</button>
    </div>

    <div class="search-row">
      <div class="field">
        <label class="field-label">SEARCH TASKS</label>
        <input type="text" id="searchInput" placeholder="Search by title..." />
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" id="activeCount">0</div><div class="lbl">Active</div></div>
      <div class="stat"><div class="num" id="doneCount">0</div><div class="lbl">Done</div></div>
    </div>

    <div class="list-panel" id="listPanel"></div>

    <div class="footer-row">
      <button id="clearCompletedBtn">Clear completed</button>
      <button id="resetAllBtn">Reset all</button>
    </div>
  </div>

<script>
(function(){
  const STORAGE_KEY = 'taskflow_tasks_v1';
  let tasks = [];
  let filter = 'all';

  const taskInput = document.getElementById('taskInput');
  const dueInput = document.getElementById('dueInput');
  const priorityInput = document.getElementById('priorityInput');
  const addBtn = document.getElementById('addBtn');
  const searchInput = document.getElementById('searchInput');
  const listPanel = document.getElementById('listPanel');
  const totalCount = document.getElementById('totalCount');
  const activeCount = document.getElementById('activeCount');
  const doneCount = document.getElementById('doneCount');
  const pctText = document.getElementById('pctText');
  const progressFill = document.getElementById('progressFill');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const clearCompletedBtn = document.getElementById('clearCompletedBtn');
  const resetAllBtn = document.getElementById('resetAllBtn');

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){ tasks = []; }
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
  }

  function formatDate(dateStr){
    if(!dateStr) return null;
    const [y,m,d] = dateStr.split('-');
    return `${d}-${m}-${y}`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(){
    const query = searchInput.value.trim().toLowerCase();

    let visible = tasks.filter(t=>{
      if(filter === 'active' && t.done) return false;
      if(filter === 'done' && !t.done) return false;
      if(query && !t.title.toLowerCase().includes(query)) return false;
      return true;
    });

    listPanel.innerHTML = '';

    if(visible.length === 0){
      const hasAny = tasks.length > 0;
      listPanel.innerHTML = `
        <div class="empty-state">
          <div class="h">${hasAny ? 'No matching tasks.' : 'No tasks here yet.'}</div>
          <div class="s">${hasAny ? 'Try a different search or filter.' : 'Add your first task and give the day a shape.'}</div>
        </div>`;
    } else {
      visible.forEach(t=>{
        const item = document.createElement('div');
        item.className = 'task-item';
        const dueLabel = t.due ? formatDate(t.due) : null;
        item.innerHTML = `
          <div class="task-check ${t.done ? 'checked' : ''}" data-id="${t.id}">${t.done ? '✓' : ''}</div>
          <div class="task-main">
            <div class="task-title ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
            <div class="task-meta">
              <span class="badge ${t.priority}">${t.priority}</span>
              ${dueLabel ? `<span>Due ${dueLabel}</span>` : ''}
            </div>
          </div>
          <button class="task-delete" data-id="${t.id}" title="Delete task">✕</button>
        `;
        listPanel.appendChild(item);
      });
    }

    const total = tasks.length;
    const done = tasks.filter(t=>t.done).length;
    const active = total - done;
    const pct = total === 0 ? 0 : Math.round((done/total)*100);

    totalCount.textContent = total;
    activeCount.textContent = active;
    doneCount.textContent = done;
    pctText.textContent = `${pct}% done`;
    progressFill.style.width = `${pct}%`;
  }

  function addTask(){
    const title = taskInput.value.trim();
    if(!title) return;
    tasks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      title,
      due: dueInput.value || null,
      priority: priorityInput.value,
      done: false
    });
    taskInput.value = '';
    dueInput.value = '';
    priorityInput.value = 'normal';
    save();
    render();
    taskInput.focus();
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') addTask(); });
  searchInput.addEventListener('input', render);

  filterBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      filterBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  listPanel.addEventListener('click', e=>{
    const check = e.target.closest('.task-check');
    const del = e.target.closest('.task-delete');
    if(check){
      const id = check.dataset.id;
      const t = tasks.find(x=>x.id === id);
      if(t){ t.done = !t.done; save(); render(); }
    } else if(del){
      const id = del.dataset.id;
      tasks = tasks.filter(x=>x.id !== id);
      save(); render();
    }
  });

  clearCompletedBtn.addEventListener('click', ()=>{
    tasks = tasks.filter(t=>!t.done);
    save(); render();
  });

  resetAllBtn.addEventListener('click', ()=>{
    if(tasks.length === 0) return;
    if(confirm('Remove all tasks? This cannot be undone.')){
      tasks = [];
      save(); render();
    }
  });

  load();
  render();
})();
</script>

</body>
</html>
